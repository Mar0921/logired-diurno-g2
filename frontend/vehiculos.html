<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiRed · Vehículos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- =====================================================================
       PANTALLA DE VEHÍCULOS
       Todos los roles consultan; administrador y flota crean, editan y eliminan.
       Taller 2: la lista sale de los datos de ejemplo de datos/vehiculos.js.
       Taller 3: los mismos datos llegarán de GET /vehiculos por el gateway
       (cada vehículo con su objeto conductor, compuesto por ms-vehiculos).
       ===================================================================== -->
  <header class="barra">
    <div class="barra-superior">
      <span class="marca">LogiRed</span>
      <div class="persona">
        <span><strong id="nombre-usuario"></strong> <span class="rol" id="rol-usuario"></span></span>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu" aria-label="Secciones"></nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Vehículos</h1>
        <p class="resumen" id="resumen">Cargando…</p>
      </div>
      <div class="herramientas">
        <input id="buscar" type="search" placeholder="Buscar placa, tipo o conductor…" aria-label="Buscar vehículos">
        <button class="boton" id="nuevo">Registrar vehículo</button>
      </div>
    </div>

    <!-- Resumen de la flota: estados, vehículos sin conductor y capacidad total -->
    <div class="tarjetas tarjetas-flota" id="tarjetas" aria-label="Resumen de la flota"></div>

    <!-- Filtro por estado del vehículo -->
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>

    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th scope="col">Placa</th>
            <th scope="col">Tipo</th>
            <th scope="col">Capacidad</th>
            <th scope="col">Conductor</th>
            <th scope="col">Estado</th>
            <th scope="col" id="col-acciones"><span class="oculto">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <div id="mensajes"></div>
  <dialog id="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="datos/vehiculos.js"></script>
  <script src="js/vehiculos.js"></script>
</body>
</html>
