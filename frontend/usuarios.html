<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiRed · Usuarios</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra-superior">
      <span class="marca">LogiRed</span>
      <div class="persona">
        <span><strong id="nombre-usuario"></strong> <span class="rol" id="rol-usuario"></span></span>
        <button id="cerrar-sesion" type="button">Cerrar sesión</button>
      </div>
    </div>
    <nav id="menu" aria-label="Secciones"></nav>
  </header>

  <main>
    <div class="cabecera-seccion">
      <div>
        <h1>Usuarios</h1>
        <p class="resumen" id="resumen">Cargando…</p>
      </div>
      <div class="herramientas">
        <input id="buscar" type="search"
          placeholder="Buscar nombre o correo…"
          aria-label="Buscar usuarios">
        <button class="boton" id="nuevo" type="button">Registrar usuario</button>
      </div>
    </div>

    <div class="tarjetas" id="tarjetas" aria-label="Resumen de usuarios"></div>

    <div class="chips" id="chips" role="group" aria-label="Filtrar usuarios"></div>

    <div class="tabla-envoltura">
      <table class="tabla">
        <thead>
          <tr>
            <th scope="col">Usuario</th>
            <th scope="col">Correo electrónico</th>
            <th scope="col">Rol</th>
            <th scope="col">Estado</th>
            <th scope="col" id="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <div id="mensajes"></div>
  <dialog id="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
